map $uri $keyacross_cache_control {
    default "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
}

# Production TLS is terminated by the private ingress proxy.
map $http_x_forwarded_proto $keyacross_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control $keyacross_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $keyacross_forwarded_proto;
        proxy_read_timeout 65s;
        proxy_buffering off;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location = /index.html {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
